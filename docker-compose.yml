services:
  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      retries: 20

  # One-shot: pulls the models into the shared volume on first start (no-op afterwards).
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "ollama pull ${EMBED_MODEL:-bge-m3} && ollama pull ${LLM_MODEL:-llama3.2}"]
    depends_on:
      ollama:
        condition: service_healthy

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Mac: Docker has no GPU access, so point at native Ollama instead (see README).
      OLLAMA_URL: ${APP_OLLAMA_URL:-http://ollama:11434}
    stdin_open: true
    tty: true
    depends_on:
      ollama-pull:
        condition: service_completed_successfully

volumes:
  ollama:
